name: Build SchoolMaster Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Debug & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install web dependencies & verify production build
        run: |
          npm ci
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode Release Keystore (if configured in GitHub Secrets)
        id: keystore
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/schoolmaster-release.jks
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded successfully."
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64 secret configured; building unsigned release APK alongside debug APK."
          fi

      - name: Build Debug APK
        working-directory: android-app
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://ais-pre-r7tdws3aisr6uosq6lza7m-370699773036.asia-northeast1.run.app' }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (and Signed AAB when keystore is provided)
        working-directory: android-app
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://ais-pre-r7tdws3aisr6uosq6lza7m-370699773036.asia-northeast1.run.app' }}
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.has_keystore == 'true' && 'app/schoolmaster-release.jks' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          if [ "${{ steps.keystore.outputs.has_keystore }}" = "true" ]; then
            gradle bundleRelease --no-daemon --stacktrace
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchoolMaster-Debug-APK
          path: android-app/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchoolMaster-Release-APK
          path: android-app/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release AAB Artifact (when signed)
        if: steps.keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SchoolMaster-Release-AAB
          path: android-app/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Publish GitHub Release on Version Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-app/app/build/outputs/apk/debug/*.apk
            android-app/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
